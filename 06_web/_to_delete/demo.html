<!doctype html>
<meta charset="utf-8">
<title>Tanuki lip-sync</title>
<style>
  body{margin:0;background:#14161a;color:#e8e6e1;font:14px/1.5 system-ui,sans-serif;overflow:hidden}
  #ui{position:fixed;left:16px;top:16px;z-index:2;background:#1e2127cc;padding:14px 16px;
      border-radius:10px;backdrop-filter:blur(8px);max-width:330px}
  h1{font-size:15px;margin:0 0 10px}
  button{background:#3d5a80;color:#fff;border:0;border-radius:6px;padding:7px 12px;
         font:inherit;cursor:pointer;margin:2px 4px 2px 0}
  button:hover{background:#4a6d99} button:disabled{opacity:.4;cursor:default}
  input[type=text]{width:100%;box-sizing:border-box;background:#12141a;color:#e8e6e1;
                   border:1px solid #333a45;border-radius:6px;padding:6px 8px;font:inherit;margin:6px 0}
  .bars{margin-top:10px;font:12px ui-monospace,monospace}
  .bar{display:flex;align-items:center;gap:6px;margin:2px 0}
  .bar span{width:44px;color:#9aa4b2} .bar i{height:7px;background:#5b8dd9;border-radius:3px;transition:none}
  small{color:#8b94a3;display:block;margin-top:8px}
</style>
<div id="ui">
  <h1>Tanuki lip-sync</h1>
  <input id="txt" type="text" value="こんにちは、たぬきです">
  <div>
    <button id="say">Speak (text track)</button>
    <button id="live">Speak (live analysis)</button>
  </div>
  <div><button id="mic">Use microphone</button><button id="stop">Stop</button></div>
  <div class="bars" id="bars"></div>
  <small id="msg">Click Speak. Audio needs a user gesture to start.</small>
</div>
<canvas id="c"></canvas>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TanukiLipSync, VISEMES } from './src/tanuki-lipsync.js';

// paths are relative to this file sitting in Tanuki/06_web/
const MODEL = '../05_model/tanuki_visemes.glb';
const TRACK = '../04_pipeline/demo_track.json';
const AUDIO = '../04_pipeline/demo_ja.wav';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 100);
camera.position.set(0, 0.52, 1.55);
camera.lookAt(0, 0.45, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x404050, 1.5));
const key = new THREE.DirectionalLight(0xfff4e8, 2.4); key.position.set(-1.2, 1.6, 2.0); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.8); fill.position.set(1.6, 0.4, 1.2); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffffff, 1.0); rim.position.set(0.4, 1.2, -1.8); scene.add(rim);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const msg = document.getElementById('msg');
let tanuki = null, track = null;

const bars = document.getElementById('bars');
const rows = {};
for (const n of [...VISEMES, 'Blink']) {
  const d = document.createElement('div'); d.className = 'bar';
  d.innerHTML = `<span>${n}</span><i style="width:0"></i>`;
  bars.appendChild(d); rows[n] = d.querySelector('i');
}

try {
  tanuki = await TanukiLipSync.load(MODEL, new GLTFLoader());
  scene.add(tanuki.object);
  // Frame the face, not the bounding box centre. glTF is Y-up while the model
  // was authored Z-up, so the face sits about 68% of the way up the body -
  // aiming at box centre points the camera at the belly, aiming at max.y at
  // the hat.
  const box = new THREE.Box3().setFromObject(tanuki.object);
  const size = box.getSize(new THREE.Vector3());
  const faceY = box.min.y + size.y * 0.66;
  const faceX = box.getCenter(new THREE.Vector3()).x - 0.02;
  camera.position.set(faceX, faceY + 0.05, 2.00);
  camera.lookAt(faceX, faceY, 0);
  msg.textContent = `loaded · morph targets: ${tanuki.morphNames.join(', ')}`;
  window.__tanukiReady = true;
  window.__rig = tanuki;      // exposed for the headless test harness
  window.__morphNames = tanuki.morphNames;
} catch (e) {
  msg.textContent = 'model failed to load: ' + e.message;
  window.__tanukiError = String(e);
}

try { track = await (await fetch(TRACK)).json(); } catch (e) { /* optional */ }

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (tanuki) {
    tanuki.update(dt);
    for (const n in rows) rows[n].style.width = (tanuki.current[n] * 90).toFixed(1) + 'px';
    window.__weights = { ...tanuki.current };
  }
  renderer.render(scene, camera);
});

const audioEl = new Audio(AUDIO); audioEl.crossOrigin = 'anonymous';
window.__audio = audioEl;   // exposed for the headless test harness
document.getElementById('say').onclick = async () => {
  if (!tanuki) return;
  msg.textContent = 'speaking (text-driven track)…';
  await tanuki.speak({ audio: audioEl, track });
  msg.textContent = 'done';
};
document.getElementById('live').onclick = async () => {
  if (!tanuki) return;
  msg.textContent = 'speaking (live formant analysis)…';
  await tanuki.speak({ audio: audioEl });
  msg.textContent = 'done';
};
document.getElementById('mic').onclick = async () => {
  const s = await navigator.mediaDevices.getUserMedia({ audio: true });
  await tanuki.listen(s);
  msg.textContent = 'listening to the microphone — say あいうえお';
};
document.getElementById('stop').onclick = () => { tanuki?.stop(); msg.textContent = 'stopped'; };
</script>
