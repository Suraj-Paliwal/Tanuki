<meta charset="utf-8"><title>Tanuki — timing self-test</title>
<style>
  :root{--bg:#0d0f14;--panel:#161a22;--line:#252b36;--fg:#e6e9ef;--dim:#8b95a7;
        --ok:#6bbf73;--bad:#e08585;--warn:#d8a657;--accent:#77a6e8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  textarea{width:100%;height:70px;background:var(--panel);color:var(--fg);
           border:1px solid var(--line);border-radius:8px;padding:10px;
           font:13px/1.6 ui-sans-serif,system-ui,sans-serif;resize:vertical}
  button{background:var(--accent);color:#0b0d12;border:0;border-radius:7px;
         padding:9px 18px;font-weight:600;cursor:pointer;font-size:14px}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;align-items:center;margin:12px 0}
  table{width:100%;border-collapse:collapse;margin-top:18px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
     color:var(--dim);font-weight:600;padding:0 8px 7px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
  td.v{font:12px ui-monospace,SFMono-Regular,monospace;white-space:nowrap;color:var(--dim)}
  .tag{font:11px ui-monospace,monospace;padding:2px 7px;border-radius:4px;font-weight:700}
  .PASS{background:rgba(107,191,115,.15);color:var(--ok)}
  .FAIL{background:rgba(224,133,133,.15);color:var(--bad)}
  .WARN{background:rgba(216,166,87,.15);color:var(--warn)}
  .INFO{background:rgba(119,166,232,.13);color:var(--accent)}
  .why{color:var(--dim);font-size:12.5px;margin-top:3px}
  #sum{margin-top:22px;padding:14px 16px;border:1px solid var(--line);
       border-radius:9px;background:var(--panel);white-space:pre-wrap;
       font:12.5px/1.7 ui-monospace,SFMono-Regular,monospace}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);
     margin:26px 0 0}
</style>

<div class="wrap">
<h1>Tanuki — timing self-test</h1>
<div class="sub">Runs the real pipeline against the running server and measures what the
ear and the eye actually get. No 3D model is loaded: this isolates timing from rendering,
so a failure here is a pipeline problem, not a frame-rate one.</div>

<textarea id="text">はい、わかりました。きょうはいいてんきですね。あしたもはれるといいですね。さんぽにいきましょう。</textarea>
<div class="row">
  <button id="go">Run checks</button>
  <span id="status" class="sub" style="margin:0"></span>
</div>

<table id="out"><thead><tr><th style="width:78px">result</th><th>check</th>
<th style="width:200px">measured</th></tr></thead><tbody></tbody></table>
<div id="sum" hidden></div>
</div>

<script type="module">
import { TanukiLipSync } from './src/tanuki-lipsync.js';
import { SpeechQueue }   from './src/speech-queue.js';

const $ = (s) => document.querySelector(s);
const tbody = $('#out tbody');
let pass = 0, fail = 0, warn = 0;

function row(state, name, measured, why) {
  if (state === 'PASS') pass++; else if (state === 'FAIL') fail++;
  else if (state === 'WARN') warn++;
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><span class="tag ${state}">${state}</span></td>`
    + `<td>${name}${why ? `<div class="why">${why}</div>` : ''}</td>`
    + `<td class="v">${measured ?? ''}</td>`;
  tbody.appendChild(tr);
}
function head(t) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td colspan="3"><h2>${t}</h2></td>`;
  tbody.appendChild(tr);
}
/** state from a value and a range: [good, tolerable] */
const judge = (v, good, tolerable) =>
  v <= good ? 'PASS' : v <= tolerable ? 'WARN' : 'FAIL';

$('#go').onclick = async () => {
  tbody.innerHTML = ''; pass = fail = warn = 0;
  $('#sum').hidden = true;
  $('#go').disabled = true;
  $('#status').textContent = 'running…';
  try { await run($('#text').value.trim()); }
  catch (e) { row('FAIL', 'the test itself threw', '', String(e && e.message || e)); }
  $('#go').disabled = false;
  $('#status').textContent = '';
  const s = $('#sum');
  s.hidden = false;
  s.textContent = `${pass} passed · ${warn} warnings · ${fail} failed\n\n`
    + (fail ? 'A FAIL is a real defect — the numbers in the right column say which.\n'
            : warn ? 'No failures. A WARN is usually the engine being slow, not the rig.\n'
                   : 'Everything inside tolerance.\n')
    + '\nThresholds come from broadcast AV-sync practice: audio may lead video by\n'
    + '~45 ms and lag it by ~125 ms before a viewer notices (ITU-R BT.1359), and\n'
    + 'film mixing works to about ±22 ms.';
};

async function run(TEXT) {
  /* ── 0. what are we even talking to ───────────────────────────────── */
  head('server');
  let st = null;
  const t0 = performance.now();
  try {
    st = await (await fetch('/api/status')).json();
    row('INFO', 'voice engine in use', st.engine,
        st.engine === 'voicevox'
          ? 'VOICEVOX: local, and it reports its own phoneme durations, so the mouth timing is exact.'
          : st.engine === 'offline'
          ? 'The built-in robot fallback. Install edge-tts, or run VOICEVOX for exact timing.'
          : 'Remote engine: every sentence is a network round trip, and the mouth timing is estimated then aligned.');
  } catch (e) {
    row('FAIL', 'server reachable', '', 'Start tanuki_tts_server.py first.');
    return;
  }

  /* ── 1. one sentence, cold: what does the engine actually cost? ────── */
  const probe = TEXT.split(/(?<=[。．.！!？?])/)[0] || TEXT.slice(0, 18);
  const uniq = probe + '​'.repeat(1 + (Date.now() % 5));   // dodge the cache
  const tA = performance.now();
  const one = await post({ text: uniq });
  const synth = performance.now() - tA;
  row(judge(synth, 700, 2000), 'engine turnaround for one sentence',
      `${synth.toFixed(0)} ms`,
      'Everything else is overlapped behind this, so it sets how long the first '
      + 'syllable takes. Over ~2 s and the pause before speech is the engine, not the rig.');
  row('INFO', 'timing source', one.timing || 'unknown',
      one.timing === 'voicevox-exact'
        ? 'Driven by the engine’s own mora durations. This is ground truth.'
        : 'Uniform mora timing warped onto the recording. Good, but inferred.');
  if (one.align && one.align.before != null) {
    const g = one.align.after - one.align.before;
    row(one.align.aligned ? (g > 0.05 ? 'PASS' : 'WARN') : 'WARN',
        'alignment improved the fit',
        `${one.align.before} → ${one.align.after}`,
        'Correlation between predicted mouth opening and real audio energy. '
        + 'Above ~0.85 tracks closely; below ~0.5 drifts visibly.');
  }
  if (one.fallback_from) {
    row('WARN', 'engine fell back', one.fallback_from.from + ' → ' + one.engine,
        one.fallback_from.error);
  }

  /* ── 2. the whole reply, through the real queue ────────────────────── */
  head('playback');
  const rig = new TanukiLipSync({ traverse(f) { f({}); } });
  const q = new SpeechQueue(rig, { api: '/api/say', body: { blink: true } });
  const ev = [];
  let t = 0;
  const at = () => performance.now() - t;
  const stalls = [], errors = [];
  q.onStall = (txt) => stalls.push(txt);
  q.onError = (e, txt) => errors.push((txt || '').slice(0, 12) + ': ' + (e.message || e));
  q.onChunk = (txt) => ev.push({ t: at(), k: 'text', txt });
  for (const el of q._pool) {
    el.addEventListener('playing', () => ev.push({ t: at(), k: 'on' }));
    el.addEventListener('pause',   () => ev.push({ t: at(), k: 'off' }));
  }
  const mouth = [];
  const tick = setInterval(() => {
    const c = rig.current;
    mouth.push([at(), Math.max(c.A, c.I, c.U, c.E, c.O)]);
  }, 20);
  const loop = () => { rig.update(0.016); if (!done) requestAnimationFrame(loop); };
  let done = false;
  t = performance.now();
  requestAnimationFrame(loop);
  const first = new Promise((res) => {
    for (const el of q._pool) el.addEventListener('playing', () => res(at()), { once: true });
  });
  await q.say(TEXT);
  const ttfs = await first;
  await new Promise((r) => setTimeout(r, 700));      // let the mouth settle
  done = true; clearInterval(tick);

  row(judge(ttfs, 1200, 2500), 'time from Send to the first syllable',
      `${ttfs.toFixed(0)} ms`,
      'The first sentence is cut short deliberately so this does not grow with '
      + 'the length of the reply.');

  /* ── 3. holes between sentences ────────────────────────────────────── */
  const gaps = [];
  for (let i = 0; i < ev.length; i++) {
    if (ev[i].k !== 'off') continue;
    const nxt = ev.slice(i + 1).find((e) => e.k === 'on');
    if (nxt) gaps.push([ev[i].t, nxt.t]);
  }
  const gapLens = gaps.map(([a, b]) => b - a);
  const worst = gapLens.length ? Math.max(...gapLens) : 0;
  row(judge(worst, 350, 700), 'longest silence between sentences',
      gapLens.length ? gapLens.map((g) => g.toFixed(0)).join(' / ') + ' ms' : 'n/a',
      'A sentence break is natural at 150–300 ms. Much more means the next clip '
      + 'was not synthesised in time.');
  row(stalls.length ? 'FAIL' : 'PASS', 'queue never starved',
      stalls.length ? `${stalls.length} stall(s)` : 'no stalls',
      stalls.length
        ? 'The engine could not keep ahead of playback. Raise `lookahead`, or use '
          + 'a local engine — this is the usual cause of long gaps.'
        : 'Each sentence was ready before the previous one ended.');

  /* ── 4. does the caption match the voice? ──────────────────────────── */
  const offs = [];
  for (let i = 0; i < ev.length; i++) {
    if (ev[i].k !== 'text') continue;
    const nxt = ev.slice(i + 1).find((e) => e.k === 'on');
    if (nxt) offs.push(nxt.t - ev[i].t);
  }
  const worstOff = offs.length ? Math.max(...offs.map(Math.abs)) : 0;
  row(judge(worstOff, 150, 400), 'caption appears with the voice',
      offs.length ? `${worstOff.toFixed(0)} ms max` : 'n/a',
      'Text printed well before the audio is the single most noticeable "lag" in '
      + 'the app, even when nothing is actually slow.');

  /* ── 5. the mouth ─────────────────────────────────────────────────── */
  head('mouth');
  let gapPeak = 0;
  for (const [a, b] of gaps) {
    const win = mouth.filter(([x]) => x >= a + 80 && x <= b - 20);
    if (win.length) gapPeak = Math.max(gapPeak, ...win.map((w) => w[1]));
  }
  row(judge(gapPeak, 0.2, 0.4), 'mouth closes between sentences',
      gaps.length ? gapPeak.toFixed(2) + ' open' : 'n/a',
      'The driver reads the track at audio.currentTime, and a paused clip’s '
      + 'clock does not move — so if nothing resets the rig, the mouth freezes '
      + 'in the last shape it held.');

  const endT = Math.max(...ev.map((e) => e.t));
  const tail = mouth.filter(([x]) => x >= endT + 250);
  const tailPeak = tail.length ? Math.max(...tail.map((w) => w[1])) : NaN;
  // The check above only catches a frozen mouth when a cut happens to land
  // mid-viseme, which is luck. Force the condition instead: a second short
  // pass that deliberately cuts each sentence mid-word.
  const stress = await freezeProbe(TEXT);
  row(judge(stress, 0.25, 0.5), 'mouth still closes when a cut lands mid-word',
      isNaN(stress) ? 'n/a' : stress.toFixed(2) + ' open',
      'Stress pass: sentences are cut 0.3 s early on purpose, so the track is '
      + 'guaranteed to be mid-vowel at the cut. Anything near 1.0 means the rig '
      + 'is being left frozen in the last shape it held.');

  row(judge(tailPeak, 0.06, 0.15), 'mouth shuts when the reply ends',
      isNaN(tailPeak) ? 'n/a' : tailPeak.toFixed(2) + ' open',
      'Otherwise the character sits there with its mouth hanging open.');

  // is the mouth actually moving for the whole of each sentence, or does it
  // stop partway - which is what a track shorter than its audio looks like
  let worstCover = 1;
  for (let i = 0; i < ev.length; i++) {
    if (ev[i].k !== 'on') continue;
    const off = ev.slice(i + 1).find((e) => e.k === 'off');
    if (!off || off.t - ev[i].t < 400) continue;
    const win = mouth.filter(([x]) => x >= ev[i].t && x <= off.t);
    if (win.length < 8) continue;
    const half = win.slice(Math.floor(win.length / 2));
    const active = half.filter((w) => w[1] > 0.08).length / half.length;
    worstCover = Math.min(worstCover, active);
  }
  row(worstCover >= 0.25 ? 'PASS' : worstCover >= 0.12 ? 'WARN' : 'FAIL',
      'mouth keeps moving to the end of each sentence',
      (worstCover * 100).toFixed(0) + '% active in 2nd half',
      'If this collapses, the viseme track is running out before the audio does '
      + '— the usual cause is the mora count not matching what was actually spoken '
      + '(kanji without pykakasi does exactly this).');

  row(errors.length ? 'FAIL' : 'PASS', 'every sentence was spoken',
      errors.length ? `${errors.length} failed` : `${ev.filter(e => e.k === 'text').length} sentences`,
      errors.length ? errors.join(' · ')
                    : 'No sentence was skipped, so nothing is missing from the audio.');
}

/** Run a short pass with deliberately early cuts; return peak mouth openness
 *  during the silences. A rig that is reset properly stays near zero. */
async function freezeProbe(TEXT) {
  const rig = new TanukiLipSync({ traverse(f) { f({}); } });
  const q = new SpeechQueue(rig, { api: '/api/say', body: { blink: true }, tail: -0.3 });
  const ev = [], mouth = [];
  let t = 0, stop = false;
  const at = () => performance.now() - t;
  for (const el of q._pool) {
    el.addEventListener('playing', () => ev.push({ t: at(), k: 'on' }));
    el.addEventListener('pause',   () => ev.push({ t: at(), k: 'off' }));
  }
  const tick = setInterval(() => {
    const c = rig.current;
    mouth.push([at(), Math.max(c.A, c.I, c.U, c.E, c.O)]);
  }, 20);
  const loop = () => { rig.update(0.016); if (!stop) requestAnimationFrame(loop); };
  t = performance.now();
  requestAnimationFrame(loop);
  await q.say(TEXT);
  await new Promise((r) => setTimeout(r, 300));
  stop = true; clearInterval(tick);

  let peak = NaN;
  for (let i = 0; i < ev.length; i++) {
    if (ev[i].k !== 'off') continue;
    const nxt = ev.slice(i + 1).find((e) => e.k === 'on');
    if (!nxt) continue;
    const win = mouth.filter(([x]) => x >= ev[i].t + 80 && x <= nxt.t - 20);
    if (win.length) peak = Math.max(isNaN(peak) ? 0 : peak, ...win.map((w) => w[1]));
  }
  return peak;
}

async function post(body) {
  const r = await fetch('/api/say', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ blink: true, ...body }),
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d;
}
</script>
